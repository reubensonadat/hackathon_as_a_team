<script>
        // Micro-interaction for the request button
        const btn = document.getElementById('requestBtn');
        btn.addEventListener('click', () => {
            const originalText = btn.querySelector('span:last-child').textContent;
            btn.querySelector('span:last-child').textContent = "REQUESTING...";
            btn.classList.add('bg-gray-800');
            
            setTimeout(() => {
                btn.querySelector('span:last-child').textContent = "REQUEST SENT!";
                btn.style.backgroundColor = '#333';
                setTimeout(() => {
                    btn.querySelector('span:last-child').textContent = originalText;
                    btn.style.backgroundColor = '';
                    btn.classList.remove('bg-gray-800');
                }, 2000);
            }, 800);
        });

        // Toggle sizing logic simulation
        const sizeButtons = document.querySelectorAll('.bg-gray-100 button');
        sizeButtons.forEach(button => {
            button.addEventListener('click', () => {
                sizeButtons.forEach(b => {
                    b.classList.remove('bg-white', 'shadow-sm', 'text-black');
                    b.classList.add('text-gray-500');
                });
                button.classList.add('bg-white', 'shadow-sm', 'text-black');
                button.classList.remove('text-gray-500');
            });
        });
    </script>
